name: Lint Codebase

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # super-linter resolves the default branch with `git rev-parse`, so it
          # needs the full git history rather than a shallow clone.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install Dependencies
        id: install
        run: npm ci

      - name: Lint Codebase
        id: super-linter
        uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          DEFAULT_BRANCH: main
          # v8 posts a summary comment by default, which needs pull-requests or
          # issues write. Not worth broadening the token for: results already
          # show up as status checks and in the job summary. Left enabled it
          # only logs a non-fatal 403 on every run.
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          # This is a regex, not a glob: the previous value (dist/**/*) also
          # matched check-dist.yml and excluded it from every linter. Anchoring
          # needs STRIP_DEFAULT_WORKSPACE_FOR_REGEX, because otherwise the regex
          # is matched against /github/workspace/... and ^ never matches.
          FILTER_REGEX_EXCLUDE: ^dist/.*
          STRIP_DEFAULT_WORKSPACE_FOR_REGEX: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          # ci.yml already runs `npm run lint`, which is this repo's eslint and
          # this repo's eslint.config.mjs. super-linter cannot be pointed at that
          # config instead: JAVASCRIPT_ES_CONFIG_FILE is shared with the JSON,
          # JSONC and VUE linters, and our config has no JSON language support,
          # so reusing it would silently stop linting JSON. Rather than lint JS
          # twice under two different rule sets, defer to ci.yml and let
          # super-linter keep its own config for JSON/JSONC.
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_JSCPD: false
          VALIDATE_HTML: false
          # Biome is a competing formatter/linter: it wants semicolons and
          # double quotes, while .prettierrc.yml sets semi: false and
          # singleQuote: true. Prettier and eslint are this repo's tools.
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
