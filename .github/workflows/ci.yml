name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-javascript:
    name: JavaScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - run: cp __tests__/data/pyproject.test1.toml pyproject.toml

      - name: Test Local Action
        id: test-action
        uses: ./

  test-action-windows:
    name: GitHub Actions Test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.3' # Use the exact same version as currently in effect for ubuntu-latest

      # windows-latest DOES ship pipx preinstalled (see actions/runner-images),
      # but only against its cached default Python patch version. Pinning an
      # exact patch above (3.12.3) that doesn't match what's cached forces
      # setup-python to delete the cached interpreter and download a fresh
      # one, which has no pipx registered against it -- hence installing it
      # explicitly here rather than relying on the image.
      - name: Install pipx
        id: install-pipx
        run: pip install pipx

      - run: cp __tests__/data/pyproject.test1.toml pyproject.toml

      - name: Test Local Action
        id: test-action
        uses: ./
